[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tb2-rlvr-env"
version = "0.1.0"
description = "RLVR environment for terminal-bench-2 built on the Harbor framework."
requires-python = ">=3.12"
dependencies = [
    # Core framework (install from source; not on PyPI yet)
    "harbor @ git+https://github.com/laude-institute/harbor.git",

    # LLM-as-judge
    "litellm>=1.50",       # model-agnostic LLM client (Claude + Gemini in one interface)
    "anthropic>=0.40",     # direct Claude SDK (kept for code paths that need raw access)

    # Phase 0 validation
    "scipy>=1.10",         # spearmanr

    # Config + schemas
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "omegaconf>=2.3",
    "python-dotenv>=1.0",  # load .env files
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.10",   # mocking Harbor in unit tests
    "ruff>=0.6",           # lint + format (replaces black)
]

# Constrained-decoding route (vLLM grammar mode for valid JSON tool calls)
inference = [
    "vllm>=0.6",
    "outlines>=0.1",
]

[project.scripts]
# TODO(stage-5): JudgeValidationCLI.run is still `...`; this entry is wired but inert.
tb2-validate-judge = "src.rewards.judge_validation:JudgeValidationCLI.run"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that make external API calls or take >1s; run with `pytest -m slow`",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names, ...)
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "C4",  # comprehensions
]
ignore = [
    "E501",  # line-too-long is handled by the formatter
]
